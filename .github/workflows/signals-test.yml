name: Signals experiment

on:
  push:
    paths:
      - "experiments/**"
      - "btcf/signals.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-forecast        # never runs at the same time as the daily job
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch signals and run the comparison
        run: python experiments/signals_test.py
      - name: Commit report and cached signal data
        run: |
          git config user.name "btc-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add reports data/signals
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Signals experiment $(date -u +%Y-%m-%d)" && git pull --rebase && git push
          fi
