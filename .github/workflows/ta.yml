name: MA RSI snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ta:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m btcf.ta
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/ta.json reports/ta.md
          git commit -m "MA/RSI snapshot" || exit 0
          git pull --rebase -q && git push
