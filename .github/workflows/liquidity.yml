name: Liquidity map
on:
  schedule:
    - cron: "12 * * * *"      # hourly, a few minutes after each candle closes
  workflow_dispatch:
    inputs:
      backtest:
        description: "Re-run the liquidity backtest (commits reports/)"
        type: boolean
        default: false
      report:
        description: "Telegram report to send now"
        type: choice
        options: [auto, weekly, daily, check, preview]
        default: auto
permissions:
  contents: write
concurrency:
  group: liquidity
  cancel-in-progress: false
jobs:
  liquidity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch candles
        run: python -m btcf.liq_fetch
      - name: Backtest
        if: ${{ inputs.backtest }}
        run: python -m btcf.liq_backtest
      - name: Previous alert state
        run: |
          mkdir -p out
          git fetch -q origin liq-data && for f in alert_state.json weekly_plan.json report_state.json; do
            git show origin/liq-data:$f > out/$f 2>/dev/null || rm -f out/$f
          done
      - name: Clusters and heatmap
        run: python -m btcf.liquidity out
      - name: Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m btcf.liq_alerts out
      - name: Weekly outlook / daily brief / mid-week check
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m btcf.liq_report "${{ inputs.report || 'auto' }}" out
      - name: Publish to the liq-data branch (history not kept)
        run: |
          cd out
          git init -q -b liq-data
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "Liquidity map $(date -u +%F' '%H:%M)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" liq-data
      - name: Commit backtest report
        if: ${{ inputs.backtest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports
          git commit -m "Liquidity backtest $(date -u +%F)" || exit 0
          git pull --rebase -q && git push
