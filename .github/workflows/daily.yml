name: Daily BTC forecast

on:
  schedule:
    - cron: "40 1 * * *"     # 01:40 UTC, after the previous UTC day has closed
  workflow_dispatch:          # run by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch prices, retrain, forecast, score, build site data
        run: python -m btcf.pipeline
      - name: Commit results
        run: |
          git config user.name "btc-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data docs/data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Daily forecast $(date -u +%Y-%m-%d)"
          git push
