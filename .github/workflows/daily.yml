name: Daily BTC forecast

on:
  schedule:
    - cron: "40 1 * * *"     # 01:40 UTC, after the previous UTC day has closed
  workflow_dispatch:          # run by hand from the Actions tab
    inputs:
      test_alert:
        description: "Also send a Telegram test message"
        type: boolean
        default: false

permissions:
  contents: write             # commit the price history, forecast log and backtest store
  pages: write                # publish the web page
  id-token: write

concurrency:
  group: daily-forecast
  cancel-in-progress: false

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch prices, retrain, forecast, score, build page data
        run: python -m btcf.pipeline

      - name: Telegram alerts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALERT_TEST: ${{ inputs.test_alert }}
        run: python -m btcf.alerts

      - name: Store liquidity candles (history grows past the API's 5000-bar window)
        run: python -m btcf.liq_fetch || true

      - name: Re-test the 1% long setup on fresh data
        run: python -m btcf.scalp backtest || true

      - name: Long 15m history (OKX) and re-test the 1.5% day-trade rules
        run: |
          python -m btcf.hist_fetch || true
          python -m btcf.daytrade backtest || true

      - name: Commit price history, forecast log, backtest store and alert state
        run: |
          git config user.name "btc-forecast-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "No changes"; else
            git commit -m "Daily forecast $(date -u +%Y-%m-%d)" && git pull --rebase -q && git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub sometimes can't see the just-uploaded artifact yet: wait and try once more
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
