name: 1% and 1.5% long setups
# GitHub delays scheduled runs by hours, so one run stays alive ~5h45m and
# checks after every 15-minute candle closes. A new run queues behind it.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: scalp
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan every 15 minutes for ~5h40m
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_EXTRA_CHATS: ${{ vars.TELEGRAM_EXTRA_CHATS }}
          DAYTRADE_TELEGRAM: ${{ vars.DAYTRADE_TELEGRAM || 'gated' }}
          GH_TOKEN: ${{ github.token }}
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          end=$(( $(date +%s) + 340*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            git pull -q --rebase || true            # pick up the newest daily predictions/backtest
            # GitHub runs the 01:40 daily schedule hours late, so start it ourselves at ~00:20 UTC
            today=$(date -u +%F); mins=$(( 10#$(date -u +%H) * 60 + 10#$(date -u +%M) ))
            if [ "$mins" -ge 20 ] && [ "$mins" -lt 240 ] && [ ! -f "/tmp/daily_$today" ]; then
              made=$(python -c "import json;print(json.load(open('data/daily_range_latest.json'))['btc'][0]['run_date'])" 2>/dev/null || echo none)
              yday=$(date -u -d yesterday +%F)
              if [ "$made" != "$yday" ]; then gh workflow run daily.yml --ref main && echo "started daily run"; fi
              touch "/tmp/daily_$today"
            fi
            python -m btcf.liq_fetch > /dev/null || true
            python -m btcf.scalp || true
            mkdir -p out/trades
            git fetch -q origin trades-data 2>/dev/null || true
            for f in trades.json zone_state.json derivs.json range_log.json; do
              git show origin/trades-data:$f > out/trades/$f 2>/dev/null || rm -f out/trades/$f
            done
            python -m btcf.derivs || true
            python -c "import json;from btcf import zones;zones.run(json.load(open('out/trades/derivs.json')))" || python -m btcf.zones || true
            python -m btcf.daytrade || true
            python -m btcf.rangetrade || true
            if [ -n "$(ls out/trades)" ]; then
              ( cd out/trades && rm -rf .git && git init -q -b trades-data \
                && git config user.name "github-actions[bot]" \
                && git config user.email "github-actions[bot]@users.noreply.github.com" \
                && git add -A && git commit -qm "Trades $(date -u +%F' '%H:%M)" && git push -qf "$PUSH_URL" trades-data ) || true
            fi
            git checkout -q -- data 2>/dev/null || true
            # sleep until 2 minutes after the next 15-minute candle closes
            now=$(date +%s); nxt=$(( (now / 900 + 1) * 900 + 120 ))
            sleep $(( nxt - now ))
          done
